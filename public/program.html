<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bokutlånssystem</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:,">
</head>
<body>
  
  <main>
    <header>
      <h1>Bokutlånssystem</h1>
    </header>
    <div class="addrm">
      <!-- Liste over bøker -->
      <section id="book-list-section">
        <h2>Tilgjengelige bøker</h2>
        <ul id="book-list"></ul>
        <section id="delete-book-section">
          <button type="button" id="delete-book-button" disabled>Slett valgt bok</button>
        </section>
      </section>
      <!-- Legge til ny bok -->
      <section id="add-book-section">
        <h2>Legg til ny bok</h2>
        <form id="add-book-form">
          <label for="title">Tittel:</label>
          <input type="text" id="title" name="title" required>
          
          <label for="author">Forfatter:</label>
          <input type="text" id="author" name="author" required>
          
          <label for="quantity">Antall:</label>
          <input type="number" id="quantity" name="quantity" min="1" required>
          
          <button type="button" id="add-book-button">Legg til bok</button>
        </form>
      </section>
    </div>

    <div class="addrm">
      <!-- Liste over lånte bøker -->
      <section id="loaned-books-section">
        <h2>Lånte bøker</h2>
        <ul id="loans-list"></ul>
        <section id="return-book-section">
          <button type="button" id="return-book-button" disabled>Returner valgt bok</button>
        </section>
      </section>
    
      <!-- Låne bok -->
      <section id="loan-book-section">
        <h2>Lån bok</h2>
        <form id="loan-book-form">
          <label for="student">Elev:</label>
          <input type="text" id="student" name="student" required>
          
          <label for="loan-title">Tittel:</label>
          <input type="text" id="loan-title" name="loan-title" required>
    
          <button type="button" id="loan-book-button">Lån bok</button>
        </form>
      </section>
    </div>
    

  </main>
  
  <script src="scripts.js"></script>
</body>
</html>
