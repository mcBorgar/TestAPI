<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-container">
        <h1>Library Login</h1>
        <form id="login-form">
            <label for="username">Brukernavn:</label>
            <input type="text" id="username" name="username" placeholder="Skriv inn brukernavn" required>
            <label for="password">Passord:</label>
            <input type="password" id="password" name="password" placeholder="Skriv inn passord" required>
            <button type="button" id="login-button">Logg inn</button>
        </form>
        <p>Har du ikke en bruker? <button type="button" id="register-button">Registrer deg</button></p>
        <p id="error-message" style="color: red; display: none;"></p>
    </div>

    <div id="register-container" style="display: none;">
        <h1>Registrer bruker</h1>
        <form id="register-form">
            <label for="reg-username">Brukernavn:</label>
            <input type="text" id="reg-username" name="username" placeholder="Skriv inn brukernavn" required>
            <label for="reg-password">Passord:</label>
            <input type="password" id="reg-password" name="password" placeholder="Skriv inn passord" required>
            <button type="button" id="register-submit">Registrer</button>
        </form>
        <p id="register-error" style="color: red; display: none;"></p>
    </div>
</body>
<script src="scripts.js"></script>
</html>
