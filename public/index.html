<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
<body">
</head>
<header class="header">
    <h1>BOKUTLÅN</h1>
</header>
    <main class="main">
        <form id="bookForm" class="LeggInn" method="post" action="/api/books">
            <h1>LEGG INN</h1>
            <label for="title">Tittel:</label>
            <input type="text" id="title" name="title" required>
          
            <label for="author">Forfatter:</label>
            <input type="text" id="author" name="author" required>
          
            <label for="quantity">Antall:</label>
            <input type="number" id="quantity" name="quantity" required>
          
            <button type="submit">Legg Til</button>
            <button type="submit">Fjern</button>
          </form>
          

          <form id="loanForm" class="LeggInn" method="post" action="/api/loans">
            <h1>LÅN UT</h1>
            <label for="student">Elev:</label>
            <input type="text" id="student" name="student" required>
          
            <label for="title2">Tittel:</label>
            <input type="text" id="title2" name="title" required>
          
            <label for="date">Dato:</label>
            <input type="date" id="date" name="date" required>
          
            <button type="submit" name="action" value="loan">LÅNE UT</button>
            <button type="submit" name="action" value="return">LEVER</button>
          </form>
          
    </main>
</body>
<script src="script.js"></script>
